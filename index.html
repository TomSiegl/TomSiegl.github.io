<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tom Siegl's Website</title>
    <style>
        body {
            margin: 0;
            padding: 3vh;
            font-family: system-ui, sans-serif;
            background: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6em;
            max-width: 65em;
            min-height: 94vh;
            margin-inline: auto;
        }

        main {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 10%;
            width: 100%;
        }

        .greeting {
            max-width: 35em;
            min-width: 15em;
        }

        img.main-img {
            max-width: 20em;
            min-width: 15em;
        }

        .main-img-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 700px) {
            main {
                flex-direction: column;
                gap: 2rem;
            }
        }

        .links {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 4rem;
            align-items: center;
            justify-content: center;
        }

        .icon-link img {
            height: 25px;
            display: block;
        }

        .highlight-container{
            display: inline-flex;
            position: relative;
            overflow: hidden;
            width: fit-content;
            padding: 0.15em 0.3em;
            margin: 0.1em 0em;
            box-sizing: border-box;
        }

        .canvas-container {
            position: absolute;
            inset: 0;
            display: flex;
            z-index: 1;
        }
    </style>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
      integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
      crossorigin="anonymous"
      defer></script>
    <script src="shader-highlight-box.js" type="module"></script>
</head>

<body>

    <main>
        <div class="greeting">
            <h1>Hi 👋</h1>

            <div style="height: 2em;"></div>

            <p>I am 
                <i>Tom Siegl</i>, 
                <br/> a 
                <i>PhD student</i> 
                at the University of Rostock.
            </p>

            <div style="height: 2em;"></div>
            
            <p>My research focuses on the 
                <i>robustness</i> 
                of machine learning models, especially 
                <i>intersectional evaluation</i> and 
                <i>robust optimization</i>.
            </p>

            <div style="height: 2em;"></div>

            <button:disabled><span name="fx"><div style="padding: 1em;">(more coming soon)</div></span></button>
        </div>

        <div class="main-img-container">
            <img class="main-img" src="assets/profile_picture.jpg" alt="An image of Tom" />
        </div>
    </main>

    <div class="links">
        <a class="icon-link" href="https://orcid.org/0000-0003-2292-1188">
            <img src="assets/ORCID-iD_icon_BW_vector.svg" alt="ORCID Profile" />
        </a>
        <a class="icon-link" href="https://www.linkedin.com/in/tom-siegl-6aa911341/">
            <img src="assets/InBug-Black.png" alt="LinkedIn Profile" />
        </a>
        <a class="icon-link" href="https://github.com/TomSiegl">
            <img src="assets/github-mark.svg" alt="GitHub Profile" />
        </a>
    </div>

</body>

</html>
