name: Test automation scripts

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test-scripts.yml"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test-scripts.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run papers_lib test suite
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
